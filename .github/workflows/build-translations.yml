name: Build translations
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      TX_TOKEN:
        required: true

jobs:
  build-translations:

    runs-on: ubuntu-22.04
    steps:
      - name: Install gettext
        run: sudo apt-get install gettext

      - name: Install Transifex CLI
        run: |
          curl -sL https://github.com/transifex/cli/releases/download/v1.6.17/tx-linux-amd64.tar.gz | sudo tar zxvf - -C /usr/bin tx

      - name: Checkout local repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          sparse-checkout: |
            .tx
            tools
            lang
          fetch-depth: 1
          persist-credentials: false

      - name: Pull translations
        continue-on-error: true
        env:
          TX_TOKEN: ${{ secrets.TX_TOKEN }}
        run: |
          if [ -z "${TX_TOKEN}" ]; then
          echo "No TX_TOKEN secret set in this repo, not pulling translations from Transifex"
          exit 1
          fi
          # Try to download all translations but don't abort on failure
          tx pull -a --force -w 2 --skip
          for delay in 0 15 30; do
            sleep "$delay"
            # Retry missing languages and exit the loop if all languages succeeded, else retry again with more backoff
            tx pull -a -d --force -w 2 && exit 0
          done
          echo "::error file=.github/workflows/build-translations.yml,title=Missing translations in release::Pulling translations from Transifex failed, build will have some missing translations."

      - name: Discard invalid translations
        run: ./lang/discard_invalid_po.sh

      - name: Update translation statistics
        run: ./lang/update_stats.sh

      - name: Store translation artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "translations"
          path: |
            lang/po
            lang/mo
            src/lang_stats.inc
            data/credits
            data/motd
