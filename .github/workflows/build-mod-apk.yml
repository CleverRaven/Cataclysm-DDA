name: "Build CDDA Mod Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - mod-mobile

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext glslang-tools

      - name: Preparar versao, shaders e catalogo de traducoes (PT/BR)
        run: |
          mkdir -p data/shaders
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl
          echo '// NOLINT(cata-header-guard)' > src/version.h
          echo '#define VERSION "0.H-Mobile-Mod"' >> src/version.h
          cat src/version.h

          echo "Compilando catalogo de idioma Portugues (Brasil)..."
          mkdir -p lang/mo/pt_BR/LC_MESSAGES
          msgfmt -f -o lang/mo/pt_BR/LC_MESSAGES/cataclysm-dda.mo lang/po/pt_BR.po

          echo "Verificando cataclysm-dda.mo gerado:"
          ls -lh lang/mo/pt_BR/LC_MESSAGES/cataclysm-dda.mo
          test -s lang/mo/pt_BR/LC_MESSAGES/cataclysm-dda.mo || (echo "ERRO: cataclysm-dda.mo de pt_BR nao encontrado ou vazio!" && exit 1)

      - name: Baixar e integrar Tilesets Graficos Modernos (UndeadPeople e UltiCa)
        run: |
          echo "Clonando UndeadPeople Tileset (Graficos estilo Project Zomboid)..."
          git clone --depth 1 https://github.com/shadow-759/UndeadPeopleTileset.git /tmp/undeadpeople
          
          mkdir -p gfx/MSX++UnDeadPeopleEdition
          cp -r /tmp/undeadpeople/MSX++UnDeadPeopleEdition/* gfx/MSX++UnDeadPeopleEdition/
          
          echo "Verificando arquivos do UndeadPeople em gfx/:"
          ls -lh gfx/MSX++UnDeadPeopleEdition/
          test -s gfx/MSX++UnDeadPeopleEdition/tile_config.json || (echo "ERRO: tile_config.json do UndeadPeople nao encontrado!" && exit 1)

          echo "Baixando tilesets oficiais HD adicionais (UltiCa)..."
          GFX_URL="https://github.com/CleverRaven/Cataclysm-DDA/releases/download/cdda-experimental-2026-10-19-0128/cdda-linux-with-graphics-x64-2026-10-19-0128.tar.gz"
          curl -sL "$GFX_URL" | tar -zxf - gfx/UltiCa || true
          if [ -d "gfx/UltiCa" ]; then
              echo "UltiCa extraido com sucesso:"
              ls -lh gfx/UltiCa/
          fi

          echo "Listando pastas em gfx/:"
          ls -lh gfx/

      - name: Compilar APK via Gradle
        working-directory: ./android
        run: |
          export UPSTREAM_BUILD_NUMBER="$((11581 + ${{ github.run_number }}))"
          chmod +x gradlew

          echo "Gerando keystore de assinatura do APK..."
          KEYSTORE_PATH="$(pwd)/app/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias cdda -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=CDDA, OU=Mod, O=CDDA, L=Local, S=Local, C=BR"
          cp -v "$KEYSTORE_PATH" release.keystore || true

          cat << EOF > keystore.properties
          storeFile=$KEYSTORE_PATH
          storePassword=password
          keyAlias=cdda
          keyPassword=password
          EOF

          echo "Iniciando compilacao otimizada Release (ARM64) com idioma PT-BR e Graficos Modernos..."
          ./gradlew -Pj=2 -Pabi_arm_32=false -Pabi_arm_64=true -Plocalize=true -Poverride_version="0.H-Mobile-Mod" assembleExperimentalRelease --stacktrace 2>&1 | tee /tmp/gradle_build.log || BUILD_STATUS=$?

          if [ -n "$BUILD_STATUS" ] && [ "$BUILD_STATUS" -ne 0 ]; then
              echo "::error title=GRADLE_FAILED::Gradle terminou com erro $BUILD_STATUS"
              tail -n 120 /tmp/gradle_build.log
              exit $BUILD_STATUS
          fi

          mkdir -p ../output_apks
          echo "Buscando e copiando APKs gerados..."
          find . -name "*.apk" -exec cp -v {} ../output_apks/ \;
          ls -lh ../output_apks/
          test -n "$(ls -A ../output_apks/*.apk 2>/dev/null)" || (echo "ERRO: Nenhum APK encontrado em output_apks!" && exit 1)

      - name: Salvar log de erro em release caso falhe
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "log-run-${{ github.run_number }}"
          name: "Build Log - Run ${{ github.run_number }}"
          body: "Log de erro da execucao ${{ github.run_number }} para depuracao."
          files: /tmp/gradle_build.log
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Mod-Android-APK
          path: output_apks/*.apk
          retention-days: 14

      - name: Criar GitHub Release com APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/mod-mobile') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v0.H-Mobile-Mod-build-${{ github.run_number }}"
          name: "CDDA Mobile Mod (Graficos UndeadPeople + PT-BR) - Build ${{ github.run_number }}"
          body: "APK do Cataclysm: Dark Days Ahead Mobile com traducao completa em Portugues do Brasil (PT-BR), graficos modernos 2D UndeadPeople (estilo Project Zomboid) + UltiCa HD, controles virtuais estilo PPSSPP + Exiled Kingdoms, analogico de 8 direcoes e gaveta retratil de contexto lateral dinamica (oculta durante a exploracao, ativa sob demanda/menus/emergencias)."
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}