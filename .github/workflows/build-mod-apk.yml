name: "Build CDDA Mod Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - mod-mobile

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext glslang-tools

      - name: Preparar versão e shaders
        run: |
          mkdir -p data/shaders
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl
          echo '// NOLINT(cata-header-guard)' > src/version.h
          echo '#define VERSION "0.H-Mobile-Mod"' >> src/version.h
          cat src/version.h

      - name: Compilar APK via Gradle
        working-directory: ./android
        run: |
          export UPSTREAM_BUILD_NUMBER="$((11581 + ${{ github.run_number }}))"
          chmod +x gradlew
          echo "Iniciando compilação otimizada Release (ARM64)..."
          ./gradlew -Pj=2 -Pabi_arm_32=false -Pabi_arm_64=true -Poverride_version="0.H-Mobile-Mod" assembleExperimentalRelease --stacktrace 2>&1 | tee gradle_build.log

      - name: Exibir log de erro caso falhe
        if: failure()
        working-directory: ./android
        run: |
          echo "=== ÚLTIMAS 250 LINHAS DO LOG ==="
          tail -n 250 gradle_build.log || true

      - name: Upload do log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: android/gradle_build.log
          retention-days: 7

      - name: Localizar APKs gerados
        id: find-apk
        run: |
          mkdir -p output_apks
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp -v {} output_apks/ \;
          ls -lh output_apks/

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Mod-Android-APK
          path: output_apks/*.apk
          retention-days: 14

      - name: Criar GitHub Release com APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/mod-mobile') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v0.H-Mobile-Mod-build-${{ github.run_number }}"
          name: "CDDA Mobile Mod - Build ${{ github.run_number }}"
          body: "APK do Cataclysm: Dark Days Ahead Mobile com nova interface no estilo PPSSPP + Exiled Kingdoms, analógico de 8 direções e slots contextuais."
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
