name: "Build CDDA Mod Android APK"

on:
  workflow_dispatch:
  push:
    branches:
      - mod-mobile

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do cÃ³digo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar dependÃªncias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext glslang-tools

      - name: Preparar versÃ£o, shaders e catÃ¡logo de traduÃ§Ãµes (PT/BR)
        run: |
          mkdir -p data/shaders
          touch data/shaders/build-*.stamp data/shaders/*.spv data/shaders/*.dxil data/shaders/*.msl
          echo '// NOLINT(cata-header-guard)' > src/version.h
          echo '#define VERSION "0.H-Mobile-Mod"' >> src/version.h
          cat src/version.h

          echo "Compilando catÃ¡logo de idioma PortuguÃªs (Brasil)..."
          mkdir -p lang/mo/pt_BR/LC_MESSAGES
          msgfmt -f -o lang/mo/pt_BR/LC_MESSAGES/cataclysm-dda.mo lang/po/pt_BR.po

          echo "Verificando cataclysm-dda.mo gerado:"
          ls -lh lang/mo/pt_BR/LC_MESSAGES/cataclysm-dda.mo
          test -s lang/mo/pt_BR/LC_MESSAGES/cataclysm-dda.mo || (echo "ERRO: cataclysm-dda.mo de pt_BR nÃ£o encontrado ou vazio!" && exit 1)

      - name: Compilar APK via Gradle
        working-directory: ./android
        run: |
          export UPSTREAM_BUILD_NUMBER="$((11581 + ${{ github.run_number }}))"
          chmod +x gradlew

          echo "Gerando keystore de assinatura do APK..."
          KEYSTORE_PATH="$(pwd)/app/release.keystore"
          keytool -genkeypair -v -keystore "$KEYSTORE_PATH" -alias cdda -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=CDDA, OU=Mod, O=CDDA, L=Local, S=Local, C=BR"
          cp -v "$KEYSTORE_PATH" release.keystore || true

          cat << EOF > keystore.properties
          storeFile=$KEYSTORE_PATH
          storePassword=password
          keyAlias=cdda
          keyPassword=password
          EOF

          echo "Iniciando compilaÃ§Ã£o otimizada Release (ARM64) com idioma PT-BR..."
          ./gradlew -Pj=2 -Pabi_arm_32=false -Pabi_arm_64=true -Plocalize=true -Poverride_version="0.H-Mobile-Mod" assembleExperimentalRelease --stacktrace 2>&1 | tee /tmp/gradle_build.log || BUILD_STATUS=$?

          if [ -n "$BUILD_STATUS" ] && [ "$BUILD_STATUS" -ne 0 ]; then
              echo "::error title=GRADLE_FAILED::Gradle terminou com erro $BUILD_STATUS"
              tail -n 120 /tmp/gradle_build.log
              exit $BUILD_STATUS
          fi

          mkdir -p ../output_apks
          echo "Buscando e copiando APKs gerados..."
          find . -name "*.apk" -exec cp -v {} ../output_apks/ \;
          ls -lh ../output_apks/
          test -n "$(ls -A ../output_apks/*.apk 2>/dev/null)" || (echo "ERRO: Nenhum APK encontrado em output_apks!" && exit 1)

      - name: Salvar log de erro em release caso falhe
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "log-run-${{ github.run_number }}"
          name: "Build Log - Run ${{ github.run_number }}"
          body: "Log de erro da execuÃ§Ã£o ${{ github.run_number }} para depuraÃ§Ã£o."
          files: /tmp/gradle_build.log
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDDA-Mod-Android-APK
          path: output_apks/*.apk
          retention-days: 14

      - name: Criar GitHub Release com APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/mod-mobile') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v0.H-Mobile-Mod-build-${{ github.run_number }}"
          name: "CDDA Mobile Mod (PT-BR) - Build ${{ github.run_number }}"
          body: "APK do Cataclysm: Dark Days Ahead Mobile com traduÃ§Ã£o em PortuguÃªs do Brasil (PT-BR) integrada, controles virtuais estilo PPSSPP + Exiled Kingdoms, analÃ³gico de 8 direÃ§Ãµes e slots contextuais."
          files: output_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}